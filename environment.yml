

name: FDMamba

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.11
  - pip>=24.3,<26
  - setuptools
  - wheel
  - packaging
  - ninja

  - pip:
      # Official PyTorch CUDA 12.4 wheels
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.5.1+cu124
      - torchvision==0.20.1+cu124

      # Numerical computing
      - numpy==1.26.4
      - scipy==1.14.1
      - pandas==2.2.3
      - scikit-learn==1.5.2

      # Image processing and visualization
      - pillow==11.0.0
      - matplotlib==3.9.2
      - seaborn==0.13.2

      # Utilities and experiment tracking
      - PyYAML==6.0.2
      - tqdm==4.67.1
      - psutil==6.1.0
      - tensorboard==2.18.0

      # Deep learning architectures
      - timm==0.9.16
      - einops==0.8.0
      - transformers==4.46.3

      # Medical datasets
      - medmnist==3.0.2

      # Causal Conv1D - CUDA 12, Torch 2.5
      - https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.5.4/causal_conv1d-1.5.4%2Bcu12torch2.5cxx11abiFALSE-cp311-cp311-linux_x86_64.whl

      # Mamba SSM - CUDA 12, Torch 2.5
      - https://github.com/state-spaces/mamba/releases/download/v2.2.4/mamba_ssm-2.2.4%2Bcu12torch2.5cxx11abiFALSE-cp311-cp311-linux_x86_64.whl
