# ResNet-50 B1: one active backbone FDConv.
# Run from the repository root: python train.py --config configs/resnet50_b1.yaml
# Starting recipe; choose any later tuning using validation QWK only.
# B0-B3 within this backbone share the physical batch, native-head dropout and
# optimization schedule to keep the component ablation controlled.
model:
  backbone: resnet50
  variant: B1
  num_classes: 5
  pretrained: false
  in_chans: 3
  drop_rate: 0.3                 # Native classifier dropout; matched across B0-B3.
  fdconv:
    # Ungrouped 3x3, 256 -> 256; pinned for timm 0.9.16.
    layer_path: layer3.3.conv2
    max_channels: 384
    kernel_num: 4
    fdconv_kwargs:
      use_ksm_local: true
      use_fbm_if_k_in: [3]       # Spatial site: FDW/KSM and FBM active.
data:
  # Preserve the publisher's splits; paths resolve from the working directory.
  train_path: data/processed/Unified_DR_(EyePacsAptos,Messidor)/augmented_resized_V2/train
  val_path: data/processed/Unified_DR_(EyePacsAptos,Messidor)/augmented_resized_V2/val
  test_path: data/processed/Unified_DR_(EyePacsAptos,Messidor)/augmented_resized_V2/test
  class_names: ["0", "1", "2", "3", "4"]
  image_size: 224                  # Fixed across all twelve configurations.
  batch_size: 8
  num_workers: 0                  # Portable default; tested epoch-resume setup.
  pin_memory: null                # Loader enables pinned memory when CUDA is available.
  drop_last_train: false
  augment: false                  # This dataset already includes offline augmentation.
  mean: null                      # RGB [0,1]; use identical train-fitted stats if changing this.
  std: null
loss:
  name: balanced_ce               # Inverse-frequency weights fitted from training labels only.
  label_smoothing: 0.0
training:
  output_dir: experiments/RN50_B1_full12_seed42
  saved_weights_dir: saved_weights
  seed: 42
  deterministic: false            # Real Mamba/CUDA kernels need not support strict determinism.
  # A conservative 5e-4 peak LR, ten warm-up epochs and 150 epochs suit the deeper scratch CNN.
  # Trainer uses AdamW and train.py supplies epoch-wise warm-up/cosine decay.
  epochs: 150
  warmup_epochs: 10
  patience: 30
  monitor: qwk
  mode: max
  min_delta: 0.0
  device: null                   # Automatically select CUDA, or CPU for smoke checks.
  amp: false                     # Keep FP32 until AMP is verified on the target GPU.
  # 8 images x 4 accumulation steps = 32 images per full optimizer update.
  # Accumulation preserves each backbone's physical BatchNorm batch across variants.
  accumulation_steps: 4
  max_grad_norm: 1.0              # Clip the normalized accumulated gradient, including FDConv/Mamba.
  optimizer_kwargs:
    lr: 0.0005
    weight_decay: 0.0001
  save_predictions: true
