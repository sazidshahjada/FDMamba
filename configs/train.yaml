# MobileNetV3 recipe. Select the dataset with train.py --dataset.
# size = native MedMNIST archive; image_size = resized model input.
# TensorBoard always logs to the experiment directory.
# See TRAINING_GUIDE.md for all 48 runs in B0 -> B1 -> B2 -> B3 order.
model:
  backbone: mobilenetv3
  variant: B3
  drop_rate: 0.2
data:
  root: data/medmnist
  size: 28
  image_size: 224
  batch_size: 32
  num_workers: 0
  augment: false
  mean: null
  std: null
training:
  epochs: 100
  warmup_epochs: 5
  lr: 0.001
  weight_decay: 0.0001
  patience: 20
  monitor: macro_f1
  class_weighted: true
  label_smoothing: 0.0
  accumulation_steps: 1
  max_grad_norm: 1.0
  amp: false
  seed: 42
  device: auto
  output_dir: null
  weights_dir: saved_weight
