model:
  backbone: resnet50
  variant: B3
  drop_rate: 0.3
data:
  root: data/medmnist
  size: 28
  image_size: 224
  batch_size: 8
  num_workers: 0
  augment: false
  mean: null
  std: null
training:
  epochs: 150
  warmup_epochs: 10
  lr: 0.0005
  weight_decay: 0.0001
  patience: 30
  monitor: macro_f1
  class_weighted: true
  label_smoothing: 0.0
  accumulation_steps: 4
  max_grad_norm: 1.0
  amp: false
  seed: 42
  device: auto
  output_dir: null
  weights_dir: saved_weight
